name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core and development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Public release audit
        run: python tools/public_release.py --project-root . audit
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
